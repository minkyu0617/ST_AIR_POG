name: 밸런스 데이터 검증

# docs/17 §17.14 — "하나라도 실패하면 빌드를 통과시키지 않습니다."
#
# 여기서 도는 것: CSV 자체의 무결성 (Tools/validate_data.py, 엔진 불필요).
#
# 🔴 여기서 돌지 **않는** 것: C++ 자동화 테스트 (SimulateMove 결정론,
#    DataRegistry 로딩). GitHub 호스티드 러너에는 언리얼 엔진이 없고
#    (약 43GB + 라이선스) 설치도 비현실적이라 클라우드에서 돌릴 수 없습니다.
#
#    그래서 **커밋 전에 로컬에서 `Tools\run_tests.ps1` 을 돌리는 것**이
#    C++ 쪽의 유일한 방어선입니다. 이 워크플로가 초록불이어도 결정론
#    테스트는 검증되지 않은 상태임을 잊지 마십시오.
#
#    해소 방법: 엔진이 설치된 자체 호스팅 러너를 붙이면 그때 이 워크플로에
#    빌드 + Automation RunTests 단계를 추가할 수 있습니다. M2 이후 검토.

on:
  push:
    paths:
      - 'Config/DataTables/**'
      - 'Tools/validate_data.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'Config/DataTables/**'
      - 'Tools/validate_data.py'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CSV는 LFS 대상이 아니므로(.gitattributes) LFS 체크아웃이 필요 없습니다.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 검증
        run: python Tools/validate_data.py
